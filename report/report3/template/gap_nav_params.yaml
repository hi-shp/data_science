# ==============================================================================
# KABOAT 자율운항보트 갭네비게이션(Gap Navigation) 표준 파라미터 설정 파일
# 대상 하드웨어: YDLIDAR TG15 (또는 2D 라이다), 서보모터 조타기, 브러시리스 쓰러스터
# ==============================================================================

gap_navigation_node:
  ros__parameters:
    # --------------------------------------------------------------------------
    # 1. 노드 주기 및 기본 통신 설정
    # --------------------------------------------------------------------------
    timer_period: 0.1          # 제어 루프 주기 (0.1초 = 10Hz, 권장: 10~20Hz)
    lidar_topic: "/scan"       # 수신할 라이다 토픽 (sensor_msgs/msg/LaserScan)
    imu_topic: "/imu"          # 수신할 IMU 토픽 (sensor_msgs/msg/Imu)
    gps_topic: "/gps/fix"      # 수신할 GPS 토픽 (sensor_msgs/msg/NavSatFix)
    servo_topic: "/actuator/key/degree"            # 출력 서보 조타각 토픽 (std_msgs/msg/Float64)
    thruster_topic: "/actuator/thruster/percentage" # 출력 쓰러스터 추력 토픽 (std_msgs/msg/Float64)

    # --------------------------------------------------------------------------
    # 2. 선체 기구학 및 자체 반사파 배제 경계 (Hull Dimensions & Exclusion Box)
    # --------------------------------------------------------------------------
    # 라이다 센서 위치 기준(base_scan) 선체의 기하학적 치수 (단위: 미터)
    boat_width: 0.80           # 선체 전폭 (m) - 소형 USV 표준
    boat_length: 1.40          # 선체 전장 (m)
    boat_radius: 0.45          # 선체 회전 반경 / 안전 마진 반경 (m)
    
    # 선체 자체 반사파(Hull Echo) 배제 영역 [x_min, x_max, y_min, y_max] (센서 기준)
    # 센서가 보트 중앙에 장착된 경우, 센서 바로 아래/옆 선체 구조물을 제거하기 위한 바운딩 박스
    hull_exclusion_box: [-0.60, 0.40, -0.45, 0.45]

    # --------------------------------------------------------------------------
    # 3. 라이다 전처리 및 유효 스캔 범위 (LiDAR Preprocessing)
    # --------------------------------------------------------------------------
    range_min: 0.20            # 유효 최소 거리 (m) - 물튀김, 선체 난반사 제거용 (하드웨어 한계보다 약간 크게)
    range_max: 8.00            # 유효 최대 거리 (m) - 실내외 수조 장애물 회피 유효 반경 (TG15 한계: 15m)
    fov_min_deg: -85.0         # 전방 탐색 최소 각도 (deg) - 우현 85도
    fov_max_deg: 85.0          # 전방 탐색 최대 각도 (deg) - 좌현 85도 (전방 170도 탐색)

    # --------------------------------------------------------------------------
    # 4. 장애물(부표) 군집화 파라미터 (Euclidean Clustering / DBSCAN)
    # --------------------------------------------------------------------------
    cluster_eps: 0.35          # 군집 판정 이웃 거리 (m) - 동일 부표 표면 반사점 묶기 (부표 직경 약 0.3m)
    cluster_min_samples: 3     # 최소 포인트 수 - 1~2개 반사 노이즈 배제
    buoy_radius: 0.18          # 부표 기하학적 반경 (m)

    # --------------------------------------------------------------------------
    # 5. 개구부(Gap) 통과 가능 조건 (Traversable Gap Constraints)
    # --------------------------------------------------------------------------
    min_gap_width: 0.85        # 통과 허용 최소 게이트 폭 (m) - 선폭(0.8m) + 안전 여유(0.05m)
    max_gap_width: 3.50        # 유효 게이트 최대 폭 (m) - 벽과 부표 사이 과대 간격 배제
    gate_clearance_margin: 0.20 # 부표 표면으로부터의 최소 안전 이격 거리 (m)

    # --------------------------------------------------------------------------
    # 6. 다목적 비용함수 가중치 (Multi-Objective Waypoint Scoring Weights)
    # --------------------------------------------------------------------------
    # 최적화 실험(10,000회 시뮬레이션 기반 학습 파라미터) 반영
    align_exp: 6.0             # 목표점(Goal) 방향 지향성 지수 (높을수록 최단 경로 추종)
    heading_exp: 4.0           # 현재 선체 헤딩과의 정렬성 지수 (높을수록 조타 안정성 향상)
    forward_exp: 6.0           # 전방 진행도 지수 (후방/측방 역주행 방지)
    clear_exp: 3.0             # 장애물 이격 안전 마진 지수 (부표 중심부 통과 유도)
    perp_exp: 2.0              # 게이트 진입 수직성 지수 (비스듬한 사선 진입 억제)

    # --------------------------------------------------------------------------
    # 7. 3차 베지에(Bézier) 곡선 및 Pure Pursuit 조타 제어 (Trajectory & Steering)
    # --------------------------------------------------------------------------
    lookahead_distance: 1.20   # Pure Pursuit 전방 주시 거리 (m) - 작으면 급조타, 크면 완만함
    steering_kp: 45.0          # 궤적 곡률(Curvature) -> 조타각 비례 게인
    slew_rate_limit: 15.0      # 프레임당 최대 조타 변화율 (deg/step) - 서보 기어 보호 및 지터 방지

    # --------------------------------------------------------------------------
    # 8. 액추에이터 구동 제한값 (Actuator Calibration)
    # --------------------------------------------------------------------------
    servo_neutral_deg: 90.0    # 서보 중립각 (deg, 직진)
    servo_min_deg: 30.0        # 서보 최대 좌회전각 (deg)
    servo_max_deg: 150.0       # 서보 최대 우회전각 (deg)
    
    # 동적 추력(Thruster) 제어
    cruising_thruster: 25.0    # 직진 순항 기본 출력 (%)
    turning_thruster: 18.0     # 급선회 시 감속 출력 (%) - 원심력 슬립 방지
    emergency_thruster: 12.0   # 긴급 회피 모드 저속 출력 (%)
